<script>(function(){try{var d=document.documentElement,t=localStorage.getItem('fretwell.theme');if(t==='dark'||t==='light')d.setAttribute('data-theme',t);if(localStorage.getItem('fretwell.large')==='1')d.classList.add('is-large');}catch(e){}})();</script>

<body class="page-app">
<a class="skip-link" href="#app">Skip to content</a>
<header class="app-header">
  <div class="app-header-inner">
    <a class="brand brand--app" href="#/" aria-label="Practice room home"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect width="32" height="32" fill="currentColor"/><g fill="var(--bg)"><rect x="5" y="9" width="22" height="1.6"/><rect x="5" y="13" width="22" height="1.6"/><rect x="5" y="17" width="22" height="1.6"/><rect x="5" y="21" width="22" height="1.6"/><rect x="5" y="25" width="22" height="1.6"/></g><circle cx="20" cy="17.8" r="5" fill="var(--vermilion)"/></svg><span class="brand-name">Practice<br>room</span></a>
    <nav class="app-nav" aria-label="Practice room">
      <a href="#/" data-nav="room">Room</a>
      <a href="#/progress" data-nav="progress">Progress</a>
      <a href="#/settings" data-nav="settings">Settings</a>

    </nav>

  </div>
