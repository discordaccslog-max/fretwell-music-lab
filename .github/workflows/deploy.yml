name: Deploy to Cloudways

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudways
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.CLOUDWAYS_DEPLOY_KEY }}
          SSH_HOST: ${{ secrets.CLOUDWAYS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verify SSH works
        env:
          SSH_USER: ${{ secrets.CLOUDWAYS_USER }}
          SSH_HOST: ${{ secrets.CLOUDWAYS_HOST }}
          REMOTE_PATH: ${{ secrets.CLOUDWAYS_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "$SSH_USER@$SSH_HOST" "test -w '$REMOTE_PATH' && echo 'OK: writable' || (echo 'FAIL: not writable — run Reset File Permissions to master in Cloudways'; exit 1)"

      - name: Deploy via rsync
        env:
          SSH_USER: ${{ secrets.CLOUDWAYS_USER }}
          SSH_HOST: ${{ secrets.CLOUDWAYS_HOST }}
          REMOTE_PATH: ${{ secrets.CLOUDWAYS_PATH }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude-from=.deployignore \
            ./ "$SSH_USER@$SSH_HOST:$REMOTE_PATH/"

      - name: Summary
        run: |
          echo "### Deployed to fretwellmusic.live :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Important:** Purge Varnish manually in Cloudways → FRETWELL → Application Settings → Purge Varnish Cache, or wait for TTL (usually a few minutes)." >> $GITHUB_STEP_SUMMARY
